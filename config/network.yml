# ---------------------------------------------------------------------------
# NETWORK PRESETS — scaffolding data only.
#
# This file is NOT read at build time. `scripts/new-geo <code>` uses it to
# generate config/geos/<code>.yml with correct language/locale/currency values
# so nobody has to type technical locale codes by hand.
#
# A GEO only becomes real once config/geos/<code>.yml and content/<code>/ exist.
# ---------------------------------------------------------------------------

defaults:
  domain_pattern: 'aigirlfriendranking-%name%.site'
  currency_position: after
  decimal_separator: ','
  thousands_separator: '.'

geos:
  gb: { name: 'United Kingdom', language: en, locale: en_GB, hreflang: en-GB, currency: GBP, symbol: '£', position: before, decimal_separator: '.', thousands_separator: ',', timezone: Europe/London, domain: 'aigirlfriendranking-uk.site' }
  us: { name: 'United States', language: en, locale: en_US, hreflang: en-US, currency: USD, symbol: '$', position: before, decimal_separator: '.', thousands_separator: ',', timezone: America/New_York, domain: 'aigirlfriendranking.com' }
