# --- entry descriptions ----------------------------------------------------
'About, privacy, affiliate disclosure and other standalone pages.': 'О нас, политика конфиденциальности, партнёрский дисклеймер и другие отдельные страницы.'
'One review per product. The product database supplies logo, rating, price and the affiliate link.': 'Один обзор на продукт. Логотип, рейтинг, цена и партнёрская ссылка подставляются из базы продуктов.'
'Ordered "best of" pages. The table and the cards are generated from the list below.': 'Рейтинговые страницы. Таблица и карточки генерируются из списка ниже.'
'Head-to-head pages. The comparison table is generated from the product database.': 'Страницы сравнения. Таблица сравнения строится из базы продуктов.'
'Long-form editorial content.': 'Большие редакционные материалы.'
'Name, description and every piece of interface text for this country.': 'Название, описание и все надписи интерфейса для этой страны.'
'Menu structure and structured-data switches for every country at once.': 'Структура меню и переключатели микроразметки — сразу для всех стран.'
'One file per product, shared by every country. Articles reference a product — they never copy its data.': 'Один файл на продукт, общий для всех стран. Статьи ссылаются на продукт, а не копируют его данные.'
