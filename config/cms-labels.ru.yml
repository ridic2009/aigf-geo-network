# ---------------------------------------------------------------------------
# Russian labels for the Pages CMS schema.
#
# Pages CMS itself has no interface localization: its own chrome (Save, Add an
# entry, Settings…) is hardcoded English. Everything the schema defines, though,
# is ours — and that is almost everything an editor reads.
#
# Used by:  ./scripts/cms-config --lang=ru
# Keys are the English strings from scripts/cms-config.php. A string without a
# translation stays English, and the script reports how many are missing.
# ---------------------------------------------------------------------------

