label: Обзоры и рейтинги
# The same schema drives Studio forms and build validation.
types:
  homepage:
    label: Главная
    section: null
    layout: index
    fields:
      hero_cta: {label: Страница главной кнопки, type: string}
      # The homepage IS the ranking: a sortable comparison table on top, the
      # cards with the editor's reasoning below it.
      ranking_title: {label: Заголовок таблицы сравнения, type: string}
      ranking:
        label: Позиции рейтинга
        type: list
        items:
          type: object
          fields:
            product: {label: Продукт, type: product, required: true}
            badge: {label: Номинация, type: string}
            highlight: {label: Почему выбран, type: text}
      top_products_title: {label: Заголовок подборки, type: string}
      top_products: {label: Товары на главной (если рейтинг не заполнен), type: list, items: {type: product}}
  static:
    label: Страница
    section: null
    layout: _default/page
    fields: {}
  review:
    label: Обзор
    section: reviews
    layout: reviews/page
    fields:
      product: {label: Продукт, type: product, required: true}
      verdict: {label: Наш вердикт, type: text}
      pros: {label: Плюсы, type: list, items: {type: string}}
      cons: {label: Минусы, type: list, items: {type: string}}
      similar: {label: Похожие приложения (пусто = подобрать автоматически), type: list, items: {type: product}}
  ranking:
    label: Рейтинг
    section: rankings
    layout: rankings/page
    fields:
      ranking:
        label: Позиции рейтинга
        type: list
        required: true
        min_items: 1
        items:
          type: object
          fields:
            product: {label: Продукт, type: product, required: true}
            badge: {label: Номинация, type: string}
            highlight: {label: Почему выбран, type: text}
  comparison:
    label: Сравнение
    section: compare
    layout: compare/page
    fields:
      products: {label: Сравниваемые продукты, type: list, required: true, min_items: 2, items: {type: product}}
  guide:
    label: Руководство
    section: guides
    layout: guides/page
    fields:
      products: {label: Упоминаемые продукты, type: list, items: {type: product}}
  article:
    label: Статья
    section: articles
    layout: articles/page
    fields:
      category:
        label: Рубрика
        type: string
        required: true
        # The value is a slug; each GEO translates it through ui.article_categories.
        options: [basics, choosing, privacy, pricing, wellbeing]
        option_labels:
          basics: 'Как это работает'
          choosing: 'Как выбрать'
          privacy: 'Приватность и безопасность'
          pricing: 'Цены и тарифы'
          wellbeing: 'Отношения и самочувствие'
      products: {label: Упоминаемые продукты, type: list, items: {type: product}}
  landing:
    label: Лендинг из блоков
    section: landings
    layout: _default/page
    fields: {}
