# ---------------------------------------------------------------------------
# GEO: United States
# Owned by developers. Not editable from Studio.
# Everything technical (html lang, canonical base, OG locale, sitemap URLs,
# hreflang, currency formatting) is derived from the values below.
# ---------------------------------------------------------------------------

geo:
  code: us
  name: United States
  country_code: US
  hreflang: en-US
  enabled: true
  staging: true
  timezone: America/New_York
  currency:
    code: USD
    symbol: $
    position: before # before|after
    decimals: 2
    decimal_separator: '.'
    thousands_separator: ','

# Domain. This single value drives: baseurl, canonical, sitemap, OG url,
# output directory (dist/<host>) and the generated Nginx vhost.
baseurl: 'http://us.45.140.14.7.sslip.io/'

language: en
languages:
  - code: en
    name: English
    locale: en_US
    enabled: true

title: 'AI Girlfriend Ranking'
baseline: 'Independent AI companion reviews'
description: 'Independent, hands-on reviews and rankings of AI girlfriend and AI companion apps.'

pages:
  dir: content/us
  default:
    '404':
      title: 'Page not found'

# Localized URL prefixes (see `routes` in config/common.yml).
routes:
  reviews: reviews
  compare: compare
  guides: guides
  rankings: ''

organization:
  name: 'AI Girlfriend Ranking'
  legal_name: 'AIGR Media'
  email: 'editorial@aigirlfriendranking.com'
  logo: '/images/brand/logo.svg'

