name: Validate

# Runs on every pull request and on any branch that is not the production branch.
# Nothing is deployed here: this only proves that the network still builds.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, dom, simplexml, fileinfo, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate data, CMS schema and content
        run: php scripts/validate.php

      - name: Build every GEO
        run: php scripts/build-all.php --optimize

      - name: Content, configuration and recovery integration tests
        run: php tests/run.php

      - name: Redirect helper tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Deployment shell syntax
        run: |
          sh -n scripts/deploy
          sh -n scripts/rollback
          sh -n scripts/lib/deploy-common.sh
          bash -n infra/auto-deploy.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Validation"
            echo ""
            echo "| GEO | Pages |"
            echo "| --- | ----- |"
            for dir in dist/*/; do
              [ -d "$dir" ] || continue
              domain=$(basename "$dir")
              pages=$(find "$dir" -name 'index.html' | wc -l)
              echo "| $domain | $pages |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
