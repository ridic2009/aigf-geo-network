# Include from the http{} block of /etc/nginx/nginx.conf
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/rss+xml
    image/svg+xml;

# Pre-compressed files, if you add a brotli/gzip step to the deploy later.
# gzip_static on;
