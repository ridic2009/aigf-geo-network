# Domain migration: keep DNS and certificates for this hostname.
server {
    listen 80;
    server_name nl.45.140.14.7.sslip.io www.nl.45.140.14.7.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://aigirlfriendranking-netherlands.site$request_uri; }
}
server {
    listen 443 ssl;
    server_name nl.45.140.14.7.sslip.io www.nl.45.140.14.7.sslip.io;
    ssl_certificate /etc/letsencrypt/live/nl.45.140.14.7.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nl.45.140.14.7.sslip.io/privkey.pem;
    return 301 https://aigirlfriendranking-netherlands.site$request_uri;
}
