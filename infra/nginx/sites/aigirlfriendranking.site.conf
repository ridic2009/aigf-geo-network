# The homepage sends a visitor from a country with its own site in another
# language straight to that site. Cloudflare names the country in CF-IPCountry;
# without the header nothing happens. A 302, so neither browsers nor search
# engines remember it. Search engines and link previews always get this page:
# the worldwide edition stays indexed and a shared link keeps its card.
map $http_cf_ipcountry $aigf_geo_country_site {
    default "";
    AT https://aigirlfriendranking-austria.site/;
    BE https://aigirlfriendranking-belgium.site/;
    BR https://aigirlfriendranking-brazil.site/;
    CZ https://aigirlfriendranking-czechia.site/;
    DE https://aigirlfriendranking-germany.site/;
    DK https://aigirlfriendranking-denmark.site/;
    ES https://aigirlfriendranking-spain.site/;
    FI https://aigirlfriendranking-finland.site/;
    FR https://aigirlfriendranking-france.site/;
    HK https://aigirlfriendranking-hongkong.site/;
    HU https://aigirlfriendranking-hungary.site/;
    IT https://aigirlfriendranking-italy.site/;
    JP https://aigirlfriendranking-japan.site/;
    KR https://aigirlfriendranking-korea.site/;
    MX https://aigirlfriendranking-mexico.site/;
    NL https://aigirlfriendranking-netherlands.site/;
    NO https://aigirlfriendranking-norway.site/;
    PL https://aigirlfriendranking-poland.site/;
    SE https://aigirlfriendranking-sweden.site/;
