  -
    name: affiliates
    label: 'Партнёрские ссылки'
    description: 'Один файл на продукт. Кнопки сами подбирают нужную ссылку по продукту и стране.'
    type: collection
    path: data/affiliates
    format: yaml
    subfolders: false
    filename:
      template: '{fields.product}.yml'
      field: false
    view:
      fields:
        - product
        - default
      primary: product
      sort:
        - product
      search:
        - product
      default:
        sort: product
        order: asc
    fields:
      -
        name: product
        label: 'Идентификатор продукта'
        type: string
        required: true
        description: 'Должен совпадать с идентификатором продукта, например "candy-ai".'
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: 'Только строчные латинские буквы, цифры и одиночные дефисы.'
      -
        name: default
        label: 'Запасная ссылка'
        type: string
        description: 'Используется для стран без собственной ссылки.'
      -
        name: geo
        label: 'Ссылки по странам'
        type: object
        fields:
          -
            name: en
            label: 'Worldwide (EN)'
            type: object
            fields:
              -
                name: url
                label: 'Партнёрская ссылка'
                type: string
          -
            name: fr
            label: 'France (FR)'
            type: object
            fields:
              -
                name: url
                label: 'Партнёрская ссылка'
                type: string
          -
            name: jp
            label: '日本 (JP)'
            type: object
            fields:
              -
                name: url
                label: 'Партнёрская ссылка'
                type: string
          -
            name: nl
            label: 'Nederland (NL)'
            type: object
            fields:
              -
                name: url
                label: 'Партнёрская ссылка'
                type: string
  -
    name: authors
    label: Авторы
    description: 'Общий справочник авторов. Страницы ссылаются на автора по идентификатору.'
    type: collection
    path: data/authors
    format: yaml
    subfolders: false
    filename:
      template: '{fields.id}.yml'
      field: false
    view:
      fields:
        - name
        - id
      primary: name
      sort:
        - name
      search:
        - name
        - id
      default:
        sort: name
        order: asc
    fields:
      -
        name: name
        label: 'Отображаемое имя'
        type: string
        required: true
      -
        name: id
        label: 'Идентификатор автора'
        type: string
        required: true
        description: 'Идентификатор для страниц, например "m-keller".'
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: 'Только строчные латинские буквы, цифры и одиночные дефисы.'
      -
        name: avatar
        label: Фото
        type: image
        options:
          media: content
