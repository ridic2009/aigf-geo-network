  -
    name: products
    label: Products
    description: 'One file per product, shared by every country. Articles reference a product — they never copy its data.'
    type: collection
    path: data/products
    format: yaml
    subfolders: false
    filename:
      template: '{fields.slug}.yml'
      field: false
    view:
      fields:
        - name
