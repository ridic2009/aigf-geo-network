tice, label: 'Affiliate notice', type: string, description: 'Shown near every monetised button and in the footer.' }, { name: availability_available, label: 'Availability available', type: string }, { name: availability_limited, label: 'Availability limited', type: string }, { name: availability_unavailable, label: 'Availability unavailable', type: string }] }
              -
