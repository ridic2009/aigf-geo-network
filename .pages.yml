ерил, type: string }, { name: related, label: Похожее, type: string }, { name: all_reviews, label: 'Все обзоры', type: string }, { name: back_to_top, label: Наверх, type: string }, { name: affiliate_notice, label: 'Партнёрский дисклеймер', type: string, description: 'Показывается рядом с партнёрскими кнопками и в подвале.' }, { name: availability_available, label: 'Доступность: доступен', type: string }, { name: availability_limited, label: 'Доступность: ограниченно', type: string }, { name: availability_unavailable, label: 'Доступность: недоступен', type: string }, { name: platforms, label: Платформы, type: string }, { name: launched, label: 'Год запуска', type: string }] }
