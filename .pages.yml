  -
    name: network
    label: Сеть
    type: group
    items:
      -
        name: network_settings
        label: 'Навигация и SEO'
        description: 'Структура меню и переключатели микроразметки — сразу для всех стран.'
        type: file
        path: config/common.yml
        format: yaml
        fields:
          -
            name: navigation
            label: Меню
            description: 'Одна структура на всю сеть; подписи каждая страна задаёт у себя.'
            type: object
            fields:
              -
                name: main
                label: 'Главное меню'
                description: 'Меню в шапке.'
                type: object
                list:
                  collapsible: { collapsed: false, summary: '{fields.label} ({fields.id})' }
                fields:
                  - { name: id, label: 'Идентификатор страницы', type: string, required: true, description: 'Например, "reviews", "about", "rankings/best-ai-girlfriend". Страны без такой страницы просто пропустят пункт.' }
                  - { name: label, label: 'Ключ подписи', type: string, required: true, description: 'Какую запись из «Пунктов меню» показывать. Тот же ключ нужно добавить каждой стране в «Настройках сайта».' }
                  - { name: weight, label: Порядок, type: number, description: 'Меньшие числа идут первыми.' }
              -
                name: footer
                label: 'Меню в подвале'
                description: 'Меню в подвале.'
                type: object
                list:
                  collapsible: { collapsed: false, summary: '{fields.label} ({fields.id})' }
                fields:
                  - { name: id, label: 'Идентификатор страницы', type: string, required: true, description: 'Например, "reviews", "about", "rankings/best-ai-girlfriend". Страны без такой страницы просто пропустят пункт.' }
                  - { name: label, label: 'Ключ подписи', type: string, required: true, description: 'Какую запись из «Пунктов меню» показывать. Тот же ключ нужно добавить каждой стране в «Настройках сайта».' }
                  - { name: weight, label: Порядок, type: number, description: 'Меньшие числа идут первыми.' }
          -
            name: schema
            label: Микроразметка
            description: 'Какие блоки schema.org выводит движок. Отключайте только при изменении требований поисковых систем.'
            type: object
            fields:
              -
                name: organization
                label: Organization
                type: boolean
              -
                name: website
                label: WebSite
                type: boolean
              -
                name: webpage
                label: WebPage
                type: boolean
              -
                name: breadcrumbs
                label: BreadcrumbList
                type: boolean
              -
                name: article
                label: 'Article (рейтинги, сравнения, гайды)'
                type: boolean
              -
                name: review
                label: 'Review (страницы обзоров с оценкой)'
                type: boolean
              -
                name: faq
                label: FAQPage
                type: boolean
                description: 'Разметка корректна в любом случае; расширенные сниппеты FAQ Google показывает лишь части сайтов.'
          -
            name: affiliate
            label: 'Партнёрские ссылки'
            type: object
            fields:
              -
                name: rel
                label: 'Атрибут rel'
                type: string
                description: 'Добавляется ко всем партнёрским ссылкам. Оставьте в нём "sponsored".'
              -
                name: target
                label: 'Открывать ссылку'
                type: string
              -
                name: redirect_base
                label: 'Сервис редиректов'
                type: string
                readonly: true
                description: 'Только для чтения. Если задан, кнопки ведут на go.<домен>/<продукт>/<страна>.'
