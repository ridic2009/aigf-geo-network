                  - { name: sections, label: 'Названия разделов', type: object, fields: [{ name: reviews, label: Обзоры, type: string }, { name: compare, label: Сравнения, type: string }, { name: guides, label: Гайды, type: string }, { name: articles, label: Статьи, type: string }, { name: rankings, label: Рейтинги, type: string }] }
