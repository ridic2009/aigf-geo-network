  -
    name: products
    label: Продукты
    description: 'Один файл на продукт, общий для всех стран. Статьи ссылаются на продукт, а не копируют его данные.'
    type: collection
    path: data/products
    format: yaml
    subfolders: false
    filename:
      template: '{fields.slug}.yml'
      field: false
    view:
      fields:
        - name
        - slug
        - rating
      primary: name
      sort:
        - name
        - rating
      search:
        - name
        - slug
      default:
        sort: name
        order: asc
    fields:
      -
        name: name
        label: 'Название продукта'
        type: string
        required: true
      -
        name: slug
        label: 'Идентификатор продукта'
        type: string
        required: true
        description: 'Идентификатор для статей и партнёрских ссылок, например "candy-ai". Он же становится именем файла.'
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: 'Только строчные латинские буквы, цифры и одиночные дефисы.'
      -
        name: website
        label: 'Официальный сайт'
        type: string
      -
        name: logo
        label: Логотип
        type: image
        options:
          media: products
      -
        name: rating
        label: 'Оценка редакции'
        type: number
        options:
          min: 0
          max: 5
          step: 0.1
        description: 'По пятибалльной шкале. Используется в карточках, таблицах и микроразметке Review.'
      -
        name: free_tier
        label: 'Есть бесплатный тариф'
        type: boolean
        default: false
      -
        name: launched
        label: 'Год запуска'
        type: number
      -
        name: category
        label: 'Категория schema.org'
        type: string
        default: LifestyleApplication
        hidden: true
      -
        name: platforms
        label: Платформы
        type: string
        description: 'Например, «Web, iOS, Android».'
      -
        name: features
        label: 'Ключевые возможности'
        type: string
        list: true
      -
        name: price
        label: 'Базовая цена'
        type: object
        fields:
          -
            name: amount
            label: 'Цена в месяц'
            type: number
          -
            name: period
            label: 'Период оплаты'
            type: string
            default: month
            hidden: true
      -
        name: geo
        label: 'Переопределения по странам'
        description: 'Заполняйте только то, что отличается от значений выше.'
        type: object
        fields:
          -
            name: en
            label: 'Worldwide (EN)'
            type: object
            fields:
              -
                name: tagline
                label: 'Краткое описание'
                type: text
              -
                name: best_for
                label: 'Лучше всего для'
                type: string
              -
                name: availability
                label: Доступность
                type: select
                default: available
                options:
                  values: [{ value: available, label: Доступен }, { value: limited, label: Ограниченно }, { value: unavailable, label: Недоступен }]
              -
                name: price
                label: Цена
                type: object
