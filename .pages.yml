# ---------------------------------------------------------------------------
# Pages CMS schema — GENERATED by scripts/cms-config. Do not edit by hand.
#
# Regenerate after adding a GEO, a page type or a product attribute:
#     ./scripts/cms-config && git commit .pages.yml
#
# Editors never see files, YAML, Git or Cecil: they pick a country, pick a page
# type and fill in fields. URLs, canonicals, hreflang, breadcrumbs, schema.org
# markup and the sitemap are produced by the engine at build time.
# ---------------------------------------------------------------------------
media:
  -
    name: content
    label: 'Изображения для статей'
    input: static/images/content
    output: /images/content
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - svg
    rename: safe
  -
    name: products
    label: 'Логотипы продуктов'
    input: static/images/products
    output: /images/products
    categories:
      - image
    extensions:
      - png
      - webp
      - svg
    rename: safe
settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: 'content: add {filename}'
      update: 'content: update {filename}'
      delete: 'content: remove {filename}'
      rename: 'content: rename {filename}'
components:
  status:
    type: select
    label: Статус
    description: 'Черновик на сайт не попадает. Сохранять незаконченное безопасно.'
    default: draft
    required: true
    options:
      values:
        -
          value: draft
          label: 'Черновик — в работе'
        -
          value: published
          label: 'Опубликовано — на сайте'
  seo:
    type: object
    label: SEO
    description: 'Canonical, hreflang и языковые теги формируются автоматически — вы заполняете только поля ниже.'
    fields:
      -
        name: title
        label: SEO-заголовок
        type: string
        required: true
        description: 'Показывается в Google. Оптимально 50–60 символов.'
      -
        name: description
        label: Мета-описание
        type: text
        required: true
        description: 'Показывается в Google под заголовком. Оптимально 120–160 символов.'
      -
        name: primary_keyword
        label: 'Основной запрос'
        type: string
        description: 'Главный поисковый запрос этой страницы.'
      -
        name: og_title
        label: 'Заголовок для соцсетей'
        type: string
        description: 'Необязательно. По умолчанию — SEO-заголовок.'
      -
        name: og_description
        label: 'Описание для соцсетей'
        type: text
        description: 'Необязательно. По умолчанию — мета-описание.'
      -
        name: og_image
        label: 'Картинка для соцсетей'
        type: image
        options:
          media: content
        description: 'Необязательно. Используется при репосте страницы.'
  indexing:
    type: object
    label: Индексация
    description: 'Оставьте оба переключателя включёнными, если нет причин поступить иначе.'
    fields:
      -
        name: index
        label: 'Разрешить индексацию'
        type: boolean
        default: true
      -
        name: follow
        label: 'Переходить по ссылкам'
        type: boolean
        default: true
  faq:
    type: object
    label: 'Частые вопросы'
    description: 'Вопросы и ответы. Выводятся на странице и превращаются в микроразметку FAQ — код писать не нужно.'
    list:
      collapsible:
        collapsed: true
        summary: '{fields.question}'
    fields:
      -
        name: question
        label: Вопрос
        type: string
        required: true
      -
        name: answer
        label: Ответ
        type: text
        required: true
  canonical:
    type: object
    label: 'Дополнительно: переопределить canonical'
    description: 'Оставьте пустым. Canonical формируется из домена и адреса страницы. Заполняйте, только если страница должна указывать на другой URL.'
    fields:
      -
        name: url
        label: 'Canonical URL'
        type: string
content:
  -
    name: guide
    label: Инструкция
    description: 'Как работать в этой CMS: статусы, обязательные поля, ссылки между страницами, картинки. Только для чтения.'
    type: file
    path: docs/copywriter-guide.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      -
        name: body
        label: Инструкция
        type: rich-text
        readonly: true
        options:
          media: false
  -
    name: sites
    label: Сайты
    description: 'Выберите страну, затем тип страницы.'
    type: group
    items:
      -
        name: site_en
        label: 'AI Girlfriend Ranking — en'
