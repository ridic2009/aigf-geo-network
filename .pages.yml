            path: config/sites/en.yml
            format: yaml
            fields:
              -
                name: title
                label: 'Название сайта'
                type: string
                required: true
                description: 'Используется в шапке, в теге <title> и в микроразметке Organization/WebSite.'
              -
                name: baseline
                label: Слоган
                type: string
              -
                name: description
                label: 'Мета-описание по умолчанию'
                type: text
                required: true
                description: 'Используется на страницах, где своё не задано.'
              -
                name: organization
                label: Издатель
                type: object
                fields:
                  - { name: name, label: 'Название издателя', type: string }
                  - { name: legal_name, label: 'Юридическое лицо', type: string }
                  - { name: email, label: 'Контактный email', type: string }
              -
                name: social
                label: 'Профили в соцсетях'
                description: 'Полный адрес профиля, например https://t.me/yourchannel. Пустую сеть в футер не выводим. Заполненные профили попадают и в микроразметку сайта — именно она связывает их с сайтом для поисковых систем.'
                type: object
