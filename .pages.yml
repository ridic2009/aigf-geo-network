# ---------------------------------------------------------------------------
# Pages CMS schema — GENERATED by scripts/cms-config. Do not edit by hand.
#
# Regenerate after adding a GEO, a page type or a product attribute:
#     ./scripts/cms-config && git commit .pages.yml
#
# Editors never see files, YAML, Git or Cecil: they pick a country, pick a page
# type and fill in fields. URLs, canonicals, hreflang, breadcrumbs, schema.org
# markup and the sitemap are produced by the engine at build time.
# ---------------------------------------------------------------------------
media:
  -
    name: content
    label: 'Article images'
    input: static/images/content
    output: /images/content
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - svg
    rename: safe
  -
    name: products
    label: 'Product logos'
    input: static/images/products
    output: /images/products
    categories:
      - image
    extensions:
      - png
      - webp
      - svg
    rename: safe
settings:
  content:
    merge: true
  commit:
    templates:
      create: 'content: add {filename}'
      update: 'content: update {filename}'
      delete: 'content: remove {filename}'
      rename: 'content: rename {filename}'
components:
  status:
    type: select
    label: Status
    description: 'Draft and Review pages are never published to the live site.'
    default: draft
    required: true
    options:
      values:
        -
          value: draft
          label: 'Draft — work in progress'
        -
          value: review
          label: 'Review — waiting for SEO approval'
        -
          value: published
          label: 'Published — live'
  seo:
    type: object
    label: SEO
    description: 'Canonical URL, hreflang and language tags are generated automatically — you only fill in the fields below.'
    fields:
      -
        name: title
        label: 'SEO title'
        type: string
        required: true
        description: 'Shown in Google. Aim for 50-60 characters.'
      -
        name: description
        label: 'Meta description'
        type: text
        required: true
        description: 'Shown under the title in Google. Aim for 120-160 characters.'
      -
        name: primary_keyword
        label: 'Primary keyword'
        type: string
        description: 'The main search term this page targets.'
      -
        name: og_title
        label: 'Social title'
        type: string
        description: 'Optional. Defaults to the SEO title.'
      -
        name: og_description
        label: 'Social description'
        type: text
        description: 'Optional. Defaults to the meta description.'
      -
        name: og_image
        label: 'Social image'
        type: image
        options:
          media: content
        description: 'Optional. Used when the page is shared on social networks.'
  indexing:
    type: object
    label: 'Search engine indexing'
    description: 'Leave both switched on unless you have a reason not to.'
    fields:
      -
        name: index
        label: 'Allow indexing'
        type: boolean
        default: true
      -
        name: follow
        label: 'Follow links'
        type: boolean
        default: true
  faq:
    type: object
    label: FAQ
    description: 'Questions and answers. Shown on the page and used for FAQ structured data — you never write code for this.'
    list:
      collapsible:
        collapsed: true
        summary: '{fields.question}'
    fields:
      -
        name: question
        label: Question
        type: string
        required: true
      -
        name: answer
        label: Answer
        type: text
        required: true
  canonical:
    type: object
    label: 'Advanced: canonical override'
    description: 'Leave empty. The canonical URL is generated from the domain and the page URL. Only fill this in when this page must point at a different URL.'
    fields:
      -
        name: url
        label: 'Canonical URL'
        type: string
