  -
    name: network
    label: Network
    type: group
    items:
      -
        name: network_settings
        label: 'Navigation & SEO'
        description: 'Menu structure and structured-data switches for every country at once.'
        type: file
        path: config/common.yml
        format: yaml
        fields:
          -
            name: navigation
            label: Menus
            description: 'One structure for the whole network; each country supplies its own labels.'
            type: object
            fields:
              -
                name: main
                label: 'Main menu'
                description: 'Header menu.'
                type: object
                list:
                  collapsible: { collapsed: false, summary: '{fields.label} ({fields.id})' }
                fields:
                  - { name: id, label: 'Page id', type: string, required: true, description: 'e.g. "reviews", "about", "rankings/best-ai-girlfriend". Countries that do not have the page simply skip the item.' }
                  - { name: label, label: 'Label key', type: string, required: true, description: 'Which entry of "Menu labels" to show. Add the same key to every country under Site settings.' }
                  - { name: weight, label: Order, type: number, description: 'Lower numbers come first.' }
              -
                name: footer
                label: 'Footer menu'
                description: 'Footer menu.'
                type: object
                list:
                  collapsible: { collapsed: false, summary: '{fields.label} ({fields.id})' }
                fields:
                  - { name: id, label: 'Page id', type: string, required: true, description: 'e.g. "reviews", "about", "rankings/best-ai-girlfriend". Countries that do not have the page simply skip the item.' }
                  - { name: label, label: 'Label key', type: string, required: true, description: 'Which entry of "Menu labels" to show. Add the same key to every country under Site settings.' }
                  - { name: weight, label: Order, type: number, description: 'Lower numbers come first.' }
          -
            name: schema
            label: 'Structured data'
            description: 'Which schema.org blocks the engine emits. Turn something off only if search guidelines change.'
            type: object
            fields:
              -
                name: organization
                label: Organization
                type: boolean
              -
                name: website
                label: WebSite
                type: boolean
              -
                name: webpage
                label: WebPage
                type: boolean
              -
                name: breadcrumbs
                label: BreadcrumbList
                type: boolean
              -
                name: article
                label: 'Article (rankings, comparisons, guides)'
                type: boolean
              -
                name: review
                label: 'Review (review pages with a rating)'
                type: boolean
              -
                name: faq
                label: FAQPage
                type: boolean
                description: 'Valid markup either way; Google limits FAQ rich results to a few site categories.'
          -
            name: affiliate
            label: 'Affiliate links'
            type: object
            fields:
              -
                name: rel
                label: 'rel attribute'
                type: string
                description: 'Applied to every monetised outbound link. Keep "sponsored" in it.'
              -
                name: target
                label: 'Link target'
                type: string
              -
                name: redirect_base
                label: 'Redirect service'
                type: string
                readonly: true
                description: 'Read-only. When set, buttons point at go.<domain>/<product>/<country> instead of the network URL.'
